services:
  db:
    image: postgres:15-alpine
    container_name: wheres_my_money_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wheresmymoney
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wheresmymoney"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wheres_my_money_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wheresmymoney
      - JWT_SECRET=super-secret-key-change-this-in-production-environments
      - PROJECT_NAME=Where's My Money?
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
